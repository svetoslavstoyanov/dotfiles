# ==============================================================================
# General & Server Settings
# ==============================================================================
onboarding = false

# ==============================================================================
# Theme & Appearance
# ==============================================================================
[theme]
name = "catppuccin"
auto_switch = false

# Custom surface overrides for active row highlight
[theme.custom]
active_row_bg = "#313244"

# ==============================================================================
# User Interface & Layout (Strictly grouped under [ui])
# ==============================================================================
[ui]
prompt_new_tab_name = false
status_indicators = "symbols"
tab_bar_right_separator = " · "

tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.config/herdr/resources.sh", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = "%H:%M" },
]

toast = { delivery = "system" }

sidebar = { spaces = { rows = [
  [
    "state_icon",
    "workspace",
    "branch",
    "git_status",
  ],
  [
    { token = "$topic", bold = true, dim = false },
  ],
] } }

# ==============================================================================
# Keybindings & Custom Commands
# ==============================================================================
[keys]
# Prefix key to enter prefix mode.
prefix = "ctrl+space"

[[keys.command]]
# Popup lazygit over the current pane; Esc closes the popup.
key = "prefix+shift+g"
type = "popup"
description = "Open lazygit"
command = "lazygit"
width = "90%"
height = "90%"

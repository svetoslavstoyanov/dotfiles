"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$git_metrics\
$fill\
$cmd_duration\
$package\
$nodejs\
$java\
$dotnet
$character"""

add_newline = false

[directory]
truncation_length = 5
format = "[$path]($style)[$lock_symbol]($lock_style)"
truncate_to_repo = true
truncation_symbol = "…/"
style = "bold #00FF7F"
read_only = ""
read_only_style = "bold white"

[package]
format = "[$symbol$version]($style) "
symbol = " "
style = "bold #ffa500"
display_private = true

[fill]
symbol = " "

[git_branch]
format = " [$symbol$branch]($style)"
symbol = " "
style = "bold #AF6EEB"

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_status]
format = "[$all_status$ahead_behind]($style)"
conflicted = " ⚔️ ×${count}"
ahead = " ⇡×${count}"
behind = " ⇣×${count}"
diverged = " ⇕×${ahead_count} 🐢 ×${behind_count}"
untracked = " ?×${count}"
stashed = ' \$×${count}'
modified = " !×${count}"
staged = " +×${count}"
renamed = " »×${count}"
deleted = " ✘×${count}"
style = "#b0e0e6"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
style = "bold yellow"
disabled = false

[git_metrics]
added_style = "bold blue"
format = "[+$added]($added_style)/[-$deleted]($deleted_style) "

[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold yellow"

[nodejs]
format = "[$symbol$version](bold green)"
version_format = "${raw}"

[java]
format = "[$symbol$version](red dimmed bold)"
version_format = "${raw}"
symbol = " "

[dotnet]
symbol = ' '
format = "[$symbol$version](#7F7FFF bold)"
version_format = '${major}.${minor}'
heuristic = true

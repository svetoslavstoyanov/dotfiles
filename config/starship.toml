"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics
$character"""

# Right-aligned: project runtimes + last command duration.
right_format = "$package$nodejs$java$dotnet$cmd_duration"

add_newline = false
scan_timeout = 50
command_timeout = 1000

palette = "catppuccin_macchiato"

# Only the colors actually referenced below (Catppuccin Macchiato).
[palettes.catppuccin_macchiato]
green  = "#a6da95"
red    = "#ed8796"
yellow = "#eed49f"
blue   = "#8aadf4"
mauve  = "#c6a0f6"
sky    = "#91d7e3"
peach  = "#f5a97f"

[directory]
truncation_length = 5
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold green"
read_only = " \uea75"                 # cod-lock (clean open frame, no border)
read_only_style = "bold red"

[git_branch]
format = " [$symbol$branch]($style)"
symbol = "\uf418 "                    # oct-git_branch
style = "bold mauve"

[git_state]
format = ' \([$state( $progress_current/$progress_total)]($style)\)'
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
style = "bold yellow"

[git_status]
format = "[$all_status$ahead_behind]($style)"
conflicted = " \uf071×${count}"       # fa-warning (no border)
ahead = " \uf431×${count}"            # oct-arrow_up
behind = " \uf433×${count}"           # oct-arrow_down
diverged = " \uf443×${ahead_count}/${behind_count}"   # oct-arrow_switch
untracked = " \uf128×${count}"        # fa-question (no border)
stashed = " \uf0c6×${count}"          # fa-paperclip (no border)
modified = " \uf040×${count}"         # fa-pencil (no border)
staged = " \uf067×${count}"           # fa-plus (no border)
renamed = " \uf061×${count}"          # fa-arrow_right (no border)
deleted = " \uf068×${count}"          # fa-minus (no border)
style = "bold sky"

[git_metrics]
disabled = false
only_nonzero_diffs = false
format = " [+$added]($added_style)/[-$deleted]($deleted_style) "
added_style = "bold green"
deleted_style = "bold red"

[package]
format = "[$symbol$version]($style) "
symbol = "\uf487 "                    # oct-package
style = "bold peach"
display_private = true

[nodejs]
format = "[$symbol$version]($style) "
symbol = "\ue719 "                    # dev-nodejs
style = "bold green"
version_format = "${raw}"

[java]
format = "[$symbol$version]($style) "
symbol = "\ue738 "                    # dev-java
style = "bold red"
version_format = "${raw}"

[dotnet]
format = "[$symbol$version]($style) "
symbol = "\ue77f "                    # dev-dotnet
style = "bold blue"
version_format = '${major}.${minor}'
heuristic = true

[cmd_duration]
min_time = 500
format = "took [$duration]($style)"   # last item on the right, so no trailing space
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold yellow)"
vimcmd_replace_symbol = "[❮](bold mauve)"
vimcmd_replace_one_symbol = "[❮](bold mauve)"
